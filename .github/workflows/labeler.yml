# pm-framework v1.0
name: Labeler

# Applies component:* labels to PRs from changed paths per .github/labeler.yml.
# Advisory (a convenience), NOT a required merge check.

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/labeler@v5
        with:
          sync-labels: true
