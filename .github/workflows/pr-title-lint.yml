# pm-framework v1.0
name: PR title lint

# Enforces Conventional Commit PR titles (type(scope): summary). The scope should mirror
# the issue's component: label. This is a required check — squash-merge uses the PR title
# as the commit subject, so it must be conventional.

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          # Conventional Commit types. Extend per repo if needed.
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
          requireScope: false
