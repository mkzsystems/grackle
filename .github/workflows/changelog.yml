# Requires a CHANGELOG.md line in every PR, or the no-changelog label (from project-viceroy).
name: Changelog

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

jobs:
  changelog:
    runs-on: ubuntu-latest
    # Skip when the author has explicitly marked the PR as not needing a changelog.
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'no-changelog') }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require a CHANGELOG [Unreleased] entry
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if ! git diff --name-only "$BASE_SHA" "$HEAD_SHA" | grep -qx 'CHANGELOG.md'; then
            echo "::error::This PR does not modify CHANGELOG.md. Add an entry under '## [Unreleased]', or apply the 'no-changelog' label for a chore/docs-only PR."
            exit 1
          fi
          if ! git diff "$BASE_SHA" "$HEAD_SHA" -- CHANGELOG.md | grep -qiE '^\+.*'; then
            echo "::error::CHANGELOG.md is in the diff but no lines were added under it."
            exit 1
          fi
          echo "CHANGELOG.md updated — OK."
